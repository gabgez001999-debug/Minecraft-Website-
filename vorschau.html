<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create-Port 3D-Vorschau</title>
<link rel="icon" href="mods/create_zeus/icon.png">
<style>
  :root { --bg: #15120f; --panel: #241f1a; --line: #3d342b; --text: #f1ebe3; --muted: #b7aa9a; --brass: #d6a04a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  header { position: fixed; left: 0; right: 0; top: 0; padding: 12px max(16px, env(safe-area-inset-left, 0px));
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: linear-gradient(#15120fe6, #15120f00); }
  header a { color: var(--brass); }
  h1 { font-size: 18px; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels span { position: absolute; transform: translate(-50%, 0); font-size: 12px; color: var(--muted);
    white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #err { position: fixed; bottom: 12px; left: 16px; color: #ff7a6b; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>
<header>
  <h1>Create-Port · 3D-Modelle</h1>
  <span class="hint">Eigene Modelle aus dem Ressourcenpaket · ziehen zum Drehen</span>
  <a href="./">← zurück</a>
</header>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Rendert Minecraft-Blockmodelle (JSON) aus resourcepack/ mit three.js.
const BASE = 'resourcepack/assets/create_zeus/';
const PARTS = [
  ['Welle', ['d_shaft'], 'y'], ['Zahnrad', ['d_cog'], 'y'], ['Großes Zahnrad', ['d_lcog'], 'y', -1],
  ['Getriebe', ['d_gearbox']], ['Handkurbel', ['d_crank'], 'y'], ['Wasserrad', ['d_wheel'], 'y'],
  ['Kreativmotor', ['d_cmotor']], ['Bohrer', ['d_drill_c'], null, 0, ['d_drill_h', 'z']],
  ['Lüfter', ['d_fan_c'], null, 0, ['d_prop', 'z']], ['Presse', ['d_press_c', 'd_press_h']],
  ['Mahlstein', ['d_mill_b'], null, 0, ['d_mill_i', 'y']], ['Tachometer', ['d_gauge']],
  ['Kanone', ['d_cannon']], ['Lichtmaschine', ['d_alt']], ['Elektromotor', ['d_emotor']],
  ['Propeller-Lager', ['d_bearing'], null, 0, ['d_bprop', 'y']],
  ['Verzauberer', ['d_enchanter']], ['Erfahrungs-Abfluss', ['d_xp_drain']], ['Solarpanel', ['d_solar']], ['Akku', ['d_battery']],
];
const loader = new THREE.TextureLoader();
const texCache = {};
function tex(ref) {
  const path = ref.replace(/^create_zeus:/, '').replace(/^minecraft:/, '');
  if (!texCache[path]) {
    const t = loader.load(BASE + 'textures/' + path + '.png');
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
    texCache[path] = new THREE.MeshLambertMaterial({ map: t, transparent: true, alphaTest: 0.1 });
  }
  return texCache[path];
}
const FACE_ORDER = ['east', 'west', 'up', 'down', 'south', 'north'];
function autoUV(face, f, t) {
  switch (face) {
    case 'north': return [16 - t[0], 16 - t[1], 16 - f[0], 16 - f[1]];
    case 'south': return [f[0], 16 - t[1], t[0], 16 - f[1]];
    case 'east': return [16 - t[2], 16 - t[1], 16 - f[2], 16 - f[1]];
    case 'west': return [f[2], 16 - t[1], t[2], 16 - f[1]];
    case 'up': return [f[0], f[2], t[0], t[2]];
    default: return [f[0], 16 - t[2], t[0], 16 - f[2]];
  }
}
function buildModel(json) {
  const group = new THREE.Group();
  const textures = json.textures || {};
  const resolve = (r) => { let k = r; for (let i = 0; i < 5 && k.startsWith('#'); i++) k = textures[k.slice(1)] || k; return k; };
  for (const el of json.elements || []) {
    const f = el.from, t = el.to;
    const geo = new THREE.BoxGeometry(Math.max(t[0] - f[0], 0.01), Math.max(t[1] - f[1], 0.01), Math.max(t[2] - f[2], 0.01));
    const uvAttr = geo.attributes.uv;
    const mats = [];
    FACE_ORDER.forEach((name, i) => {
      const face = el.faces[name];
      if (!face) { mats.push(new THREE.MeshBasicMaterial({ visible: false })); return; }
      mats.push(tex(resolve(face.texture)));
      let uv = face.uv || autoUV(name, f, t);
      uv = uv.map(clamp16);
      const [u0, v0, u1, v1] = uv.map((v) => v / 16);
      // BoxGeometry: 4 Ecken pro Seite (oben links, oben rechts, unten links, unten rechts)
      const o = i * 4;
      uvAttr.setXY(o, u0, 1 - v0); uvAttr.setXY(o + 1, u1, 1 - v0);
      uvAttr.setXY(o + 2, u0, 1 - v1); uvAttr.setXY(o + 3, u1, 1 - v1);
    });
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set((f[0] + t[0]) / 2 - 8, (f[1] + t[1]) / 2 - 8, (f[2] + t[2]) / 2 - 8);
    if (el.rotation) {
      const r = el.rotation, pivot = new THREE.Group();
      pivot.position.set(r.origin[0] - 8, r.origin[1] - 8, r.origin[2] - 8);
      mesh.position.sub(pivot.position);
      pivot.add(mesh);
      pivot.rotation[r.axis] = THREE.MathUtils.degToRad(r.angle);
      group.add(pivot);
    } else group.add(mesh);
  }
  group.scale.setScalar(1 / 16);
  return group;
}
function clamp16(v) { return Math.min(16, Math.max(0, v)); }
const cache = {};
async function model(name) {
  if (!cache[name]) cache[name] = fetch(BASE + 'models/block/' + name + '.json').then((r) => r.json());
  return buildModel(await cache[name]);
}

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15120f);
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3, 6, 4); scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const spinners = [];
const labels = [];
const cols = 4, gap = 3.2;

(async () => {
  try {
    for (let i = 0; i < PARTS.length; i++) {
      const [label, statics, spinAxis, dir, extra] = PARTS[i];
      const holder = new THREE.Group();
      holder.position.set((i % cols - (cols - 1) / 2) * gap, 0, Math.floor(i / cols) * gap - 4.5);
      for (const s of statics) {
        const m = await model(s);
        if (spinAxis) { const pivot = new THREE.Group(); pivot.add(m); holder.add(pivot); spinners.push([pivot, spinAxis, dir || 1]); }
        else holder.add(m);
      }
      if (extra) {
        const m = await model(extra[0]);
        const pivot = new THREE.Group(); pivot.add(m);
        if (extra[1] === 'z') { pivot.rotation.x = -Math.PI / 2; const inner = new THREE.Group(); inner.add(pivot); holder.add(inner); spinners.push([pivot, 'z', 1]); }
        else { holder.add(pivot); spinners.push([pivot, 'y', 1]); }
      }
      scene.add(holder);
      const span = document.createElement('span'); span.textContent = label;
      document.getElementById('labels').appendChild(span);
      labels.push([span, holder]);
    }
  } catch (e) { document.getElementById('err').textContent = 'Fehler: ' + e.message; }
})();

let yaw = 0.6, pitch = 0.55, drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (!drag) return; yaw = drag[2] - (e.clientX - drag[0]) * 0.008; pitch = Math.max(0.1, Math.min(1.3, drag[3] + (e.clientY - drag[1]) * 0.006)); });
canvas.addEventListener('pointerup', () => { drag = null; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!reduce) for (const [p, axis, dir] of spinners) p.rotation[axis] += dt * 1.6 * dir;
  const dist = innerWidth < innerHeight ? 30 : 21;
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, -0.5, 0.4);
  renderer.render(scene, camera);
  for (const [span, holder] of labels) {
    const v = holder.position.clone(); v.y -= 0.95; v.project(camera);
    span.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    span.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
